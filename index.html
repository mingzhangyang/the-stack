      <h1>The Stack — Pick-up Sticks</h1>
      <p>
        The Stack is a digital recreation of the classic pick-up sticks game. Thirty sticks fall into
        a pile; lift each one without disturbing any stick resting on top of it. A clean lift scores a
        point, a disturbed pile costs a life, and you get three. There is a top-down view and a
        draggable 3D view for reading the pile from another angle.
